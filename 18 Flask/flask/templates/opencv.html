<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision | Live Streaming</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, #0d1527 0%, #070a12 90%);
            color: #f8fafc;
            padding: 24px;
        }

        .camera-card {
            width: 100%;
            max-width: 820px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(56, 189, 248, 0.06);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 4px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #020617;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .video-container img {
            width: 100%;
            height: auto;
            max-height: 520px;
            object-fit: cover;
            display: block;
            border-radius: 16px;
            transition: transform 0.3s ease;
        }

        .footer-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8125rem;
            color: #64748b;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .device-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div class="camera-card">
        <!-- Top Section -->
        <div class="header">
            <div class="header-title">
                <h1>OpenCV Video Stream</h1>
                <p>Real-time frame pipeline connected</p>
            </div>
            <div class="live-badge">
                <span class="pulse-dot"></span>
                Live Feed
            </div>
        </div>

        <!-- Video Stream Frame -->
        <div class="video-container">
            <img src="{{ url_for('Video') }}" alt="Camera Stream" />
        </div>

        <!-- Bottom Status Bar -->
        <div class="footer-status">
            <div class="device-info">
                <span class="status-dot"></span>
                <span>Camera Source: cv2.VideoCapture(0)</span>
            </div>
            <span>Status: Connected</span>
        </div>
    </div>

</body>

</html>
